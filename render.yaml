services:
  - type: web
    name: docuguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: docuguard-db
    databaseName: trustvault
    user: trustvault_app
